name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless. On main, every run
# finishes, so each merged commit has its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit, with the tag alongside: a tag can be moved, a commit
# can't. Dependabot updates both.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # commitlint reads the pull request's commits
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # What ships must have no known high-severity vulnerabilities. Dev tooling is
      # left to Dependabot: its advisories are often unfixable until upstream moves.
      - run: npm audit --omit=dev --audit-level=high

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests, with coverage floors
        run: npm run test:coverage
      - uses: ./.github/actions/playwright
      - name: Every story renders, passes its play function, and has no axe violations
        run: npm run test:stories
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright
      - uses: ./.github/actions/next-cache
      - run: npm run build
      - name: Browser tests (every chaos preset, guards, expiry, axe, 375px)
        run: npm run test:e2e
      # On their own, so nothing else competes for the CPU while they measure; no retries.
      - name: Responsiveness budgets (the seat map, the orders table)
        run: npm run test:e2e:perf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-reports
          path: |
            playwright-report
            test-results

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/next-cache
      - run: npm run build
      - name: Lighthouse budgets
        run: npx lhci autorun
      # The buyer's pages on a mid-range phone: performance at least 0.85, below desktop's
      # 0.95. A laptop scores them 0.93 to 0.94; this runner, 0.84 to 0.92 a run, from
      # React and Next starting up and the sandbox's backend, which every page pays
      # (ADR 010). And a budget on the scripts' total size.
      - name: Lighthouse budgets, mobile (buyer pages)
        run: npm run lhci:mobile
      # Kept on a pass too: LHCI prints scores only when one fails, and the reports say
      # how close a pass was and how fast the runner measured (its benchmarkIndex).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            .lighthouseci-mobile
          # Both start with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          retention-days: 14

  server:
    # The buyer's checkout in server mode, on Postgres (ADR 018). Postgres comes from the
    # embedded-postgres package, as it does on a laptop, so there's no service to run.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - name: The server backend against real Postgres (races, webhooks, the shared contract)
        run: npm run test:server
      - uses: ./.github/actions/next-cache
        with:
          dist-dir: .next-server
      - run: npm run build:server
      - uses: ./.github/actions/playwright
      - name: The buyer's flows against server mode
        run: npm run test:e2e:server
      - uses: ./.github/actions/next-cache
        with:
          dist-dir: .next-razorpay
      - run: npm run build:razorpay
      - name: Paying through Razorpay's checkout, against a stand-in for Razorpay
        run: npm run test:e2e:razorpay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: server-reports
          path: |
            playwright-report
            test-results/server
            test-results/razorpay

  visual:
    # Screenshots only compare on the machine that made them: the same OS, browser build,
    # fonts and CPU architecture. This is Playwright's Linux image on arm64, the same as
    # `npm run test:visual` on an Apple-silicon laptop (ADR 017). A unit test keeps the
    # tag in step with the installed Playwright. The image has its browsers already.
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: Screenshots of every story, in both themes and at 375 px, with axe
        run: npx playwright test --config=playwright.visual.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report/visual
            test-results/visual
