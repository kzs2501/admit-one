name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint reads the pull request's commits
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # What ships must have no known high-severity vulnerabilities. Dev tooling is
      # left to Dependabot: its advisories are often unfixable until upstream moves.
      - run: npm audit --omit=dev --audit-level=high

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Unit tests, with coverage floors
        run: npm run test:coverage
      - name: Every story renders, passes its play function, and has no axe violations
        run: npm run test:stories
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
      - run: npm run build

      - name: Browser tests (every chaos preset, guards, expiry, axe, 375px)
        run: npm run test:e2e
      # On their own, so nothing else competes for the CPU while they measure; no retries.
      - name: Responsiveness budgets (the seat map, the orders table)
        run: npm run test:e2e:perf

      - name: Lighthouse budgets
        run: npx lhci autorun
      # The seat map on a mid-range phone. Its performance floor is today's (0.85), not
      # the desktop 0.95: mobile LCP is bound by the app's JavaScript (ADR 010).
      - name: Lighthouse budgets, mobile (seat map)
        run: npm run lhci:mobile

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci

  server:
    # The buyer's checkout in server mode, on Postgres (ADR 018). Postgres comes from the
    # embedded-postgres package, as it does on a laptop, so there's no service to run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - name: The server backend against real Postgres (races, webhooks, the shared contract)
        run: npm run test:server
      - run: npm run build:server
      - run: npx playwright install --with-deps chromium
      - name: The buyer's flows against server mode
        run: npm run test:e2e:server
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-reports
          path: |
            playwright-report
            test-results/server

  visual:
    # Screenshots only compare on the machine that made them: the same OS, browser build,
    # fonts and CPU architecture. This is Playwright's Linux image on arm64, the same as
    # `npm run test:visual` on an Apple-silicon laptop (ADR 017). A unit test keeps the
    # tag in step with the installed Playwright.
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: Screenshots of every story, in both themes and at 375 px, with axe
        run: npx playwright test --config=playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report/visual
            test-results/visual
