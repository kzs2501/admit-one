name: Playwright's Chromium
description: Chromium for Playwright, from the cache when this lockfile has been seen before.
runs:
  using: composite
  steps:
    # The browsers are keyed by the lockfile, which pins Playwright's version, and the
    # browser build with it. The system libraries they need aren't cached: they're apt's.
    - id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
